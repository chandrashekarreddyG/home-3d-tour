<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
window.__ok = true;

// Units: 1 world unit = 1 foot. World x = plan north->south, world z = plan east->west,
// origin at the outer north-east corner of the 43' x 43' footprint, so every number below
// is a dimension read straight off the floor plan.
const PI = Math.PI, H = 9, EYE = 5.3;
const rad = d => d * PI / 180;
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- renderer
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
let pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;            // static scene: re-render the shadow map only when the look changes
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe4ebf0);
scene.fog = new THREE.Fog(0xe4ebf0, 130, 330);   // melts the ground plane into the sky
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 1, 700);

// ---------- procedural textures (canvas drawn in code, no image files)
const hex = c => '#' + new THREE.Color(c).getHexString();
const mixc = (a, b, t) => '#' + new THREE.Color(a).lerp(new THREE.Color(b), t).getHexString();
function ctex(size, draw, w = size) {
  const c = document.createElement('canvas'); c.width = w; c.height = size;
  draw(c.getContext('2d'), size, w);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = ANISO;
  return t;
}
// Floor textures cover 8 ft x 8 ft; floor UVs are world feet / 8.
function woodTex(a, b, seed) {
  return ctex(1024, (g, s) => {
    const r = rng(seed), rows = 14, ph = s / rows, seam = mixc(b, 0x000000, .45);
    g.fillStyle = hex(a); g.fillRect(0, 0, s, s);
    for (let i = 0; i < rows; i++) {
      let x = -r() * 400;
      while (x < s) {
        const len = 260 + r() * 420;
        g.fillStyle = mixc(a, b, r() * .5); g.fillRect(x, i * ph, len, ph);
        g.strokeStyle = mixc(a, b, .8);
        for (let j = 0; j < 10; j++) {
          const y = i * ph + 3 + r() * (ph - 6);
          g.globalAlpha = .05 + r() * .1; g.lineWidth = .6 + r();
          g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + len * .3, y + r() * 4 - 2, x + len * .7, y + r() * 4 - 2, x + len, y + r() * 2 - 1); g.stroke();
        }
        g.globalAlpha = .3; g.fillStyle = seam; g.fillRect(x + len - 1, i * ph, 1.5, ph); g.globalAlpha = 1;
        x += len;
      }
      g.globalAlpha = .3; g.fillStyle = seam; g.fillRect(0, i * ph, s, 1.5); g.globalAlpha = 1;
    }
  });
}
function marbleTex(a, v, v2, seed, tiles = 0) {
  return ctex(1024, (g, s) => {
    const r = rng(seed);
    g.fillStyle = hex(a); g.fillRect(0, 0, s, s);
    for (let i = 0; i < 40; i++) {
      const x = r() * s, y = r() * s, R = 80 + r() * 220, gr = g.createRadialGradient(x, y, 0, x, y, R);
      gr.addColorStop(0, i % 2 ? 'rgba(255,255,255,.10)' : 'rgba(120,110,100,.07)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(x - R, y - R, R * 2, R * 2);
    }
    g.lineCap = 'round';
    for (let i = 0; i < 16; i++) {
      let x = r() * s, y = r() * s, ang = r() * 6.28;
      g.strokeStyle = hex(i % 4 === 0 ? v2 : v); g.globalAlpha = .18 + r() * .4; g.lineWidth = .6 + r() * 2.4;
      g.beginPath(); g.moveTo(x, y);
      for (let j = 0; j < 26; j++) { ang += (r() - .5) * .9; x += Math.cos(ang) * 30; y += Math.sin(ang) * 30; g.lineTo(x, y); }
      g.stroke();
    }
    g.globalAlpha = 1;
    if (tiles) {
      g.strokeStyle = 'rgba(60,50,40,.3)'; g.lineWidth = 1.5;
      for (let i = 0; i <= tiles; i++) { const p = i * s / tiles; g.beginPath(); g.moveTo(p, 0); g.lineTo(p, s); g.moveTo(0, p); g.lineTo(s, p); g.stroke(); }
    }
  });
}
function tileTex(a, b, n, grout, seed) {
  return ctex(512, (g, s) => {
    const r = rng(seed), t = s / n;
    g.fillStyle = hex(grout); g.fillRect(0, 0, s, s);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      g.fillStyle = mixc((i + j) % 2 ? b : a, 0x808080, r() * .05);
      g.fillRect(i * t + 1.5, j * t + 1.5, t - 3, t - 3);
    }
  });
}
// alpha(x, y) = fx(x) * fy(y): portable soft-edged decals without ctx.filter
function softTex(w, h, fx, fy) {
  return ctex(h, (g) => {
    const gx = g.createLinearGradient(0, 0, w, 0); fx.forEach(([p, al]) => gx.addColorStop(p, `rgba(255,255,255,${al})`));
    g.fillStyle = gx; g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = 'destination-in';
    const gy = g.createLinearGradient(0, 0, 0, h); fy.forEach(([p, al]) => gy.addColorStop(p, `rgba(255,255,255,${al})`));
    g.fillStyle = gy; g.fillRect(0, 0, w, h);
  }, w);
}
const edge = [[0, 0], [.3, 1], [.7, 1], [1, 0]];
const blobTex = softTex(64, 64, edge, edge);
const poolTex = softTex(64, 128, [[0, 0], [.18, 1], [.82, 1], [1, 0]], [[0, .95], [.35, .5], [1, 0]]);

const lam = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .95, metalness: 0, ...o });   // matte
const std = (c, r = .6, m = 0, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m, ...o });
const flag = (mat, f) => (Object.assign(mat.userData, f), mat);

// ---------- geometry batcher: every primitive is baked into one merged mesh per material,
// so a fully furnished style costs a few dozen draw calls instead of thousands.
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _s = new THREE.Vector3();
function roundRect(w, h, r) {
  const a = w / 2, b = h / 2, s = new THREE.Shape(); r = Math.max(0, Math.min(r, a, b));
  s.moveTo(-a + r, -b); s.lineTo(a - r, -b);
  if (r) s.absarc(a - r, -b + r, r, -PI / 2, 0); s.lineTo(a, b - r);
  if (r) s.absarc(a - r, b - r, r, 0, PI / 2); s.lineTo(-a + r, b);
  if (r) s.absarc(-a + r, b - r, r, PI / 2, PI); s.lineTo(-a, -b + r);

}
function extrudeRR(w, h, t, r) {           // rounded rectangle in XY, thickness t along z, UVs normalised to 0..1
  const g = new THREE.ExtrudeGeometry(roundRect(w, h, r), { depth: t, bevelEnabled: false, curveSegments: 8 });
  const p = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) / w + .5, p.getY(i) / h + .5);
  g.translate(0, 0, -t / 2);
  return g;
}
class Batch {
  constructor() { this.buckets = new Map(); this.T = new THREE.Matrix4(); this.col = []; }
  // Place the local frame: furniture is modelled around its own origin with its front toward local +z.
  // deg 0 faces west (+z), 180 east, 90 south (+x), -90 north.
  at(x = 0, z = 0, deg = 0) { this.T.makeRotationY(rad(deg)); this.T.setPosition(x, 0, z); return this; }
  sub(x, z, deg, fn) { const old = this.T.clone(); this.T.multiply(_m.makeRotationY(rad(deg)).setPosition(x, 0, z)); fn(); this.T.copy(old); }
  add(mat, g, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
    if (g.index) g = g.toNonIndexed();
    _m.compose(_v.set(x, y, z), _q.setFromEuler(_e.set(rx, ry, rz, 'YXZ')), _s.set(sx, sy, sz));
    g.applyMatrix4(_m).applyMatrix4(this.T);

    a.push(g);
  }
  // box with its base at y; r > 0 rounds every edge
  bx(mat, w, h, d, x = 0, y = 0, z = 0, r = 0, ry = 0, rx = 0, rz = 0) {
    r = Math.min(r, w / 2.02, h / 2.02, d / 2.02);
    this.add(mat, r > .012 ? new RoundedBoxGeometry(w, h, d, 2, r) : new THREE.BoxGeometry(w, h, d), x, y + h / 2, z, rx, ry, rz);
  }
  cyl(mat, r, h, x = 0, y = 0, z = 0, rTop = r, seg = 14) { this.add(mat, new THREE.CylinderGeometry(rTop, r, h, seg), x, y + h / 2, z); }
  sph(mat, r, x, y, z, sx = 1, sy = 1, sz = 1, seg = 12) { this.add(mat, new THREE.SphereGeometry(r, seg, Math.max(6, seg * .7 | 0)), x, y, z, 0, 0, 0, sx, sy, sz); }
  torus(mat, R, t, x, y, z, rx = PI / 2, arc = PI * 2) { this.add(mat, new THREE.TorusGeometry(R, t, 8, 24, arc), x, y, z, rx); }
  lathe(mat, pts, x, y, z, seg = 18, s = 1) { this.add(mat, new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0] * s, p[1] * s)), seg), x, y, z); }

      x0 = Math.min(x0, _v.x); x1 = Math.max(x1, _v.x); z0 = Math.min(z0, _v.z); z1 = Math.max(z1, _v.z);

// ---------- materials of the architectural shell (recoloured per style)
const decal = { transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 };
const MAT = {
  wall: lam(0xf2eee6), trim: lam(0xfaf8f3), frame: lam(0xf7f5f0), door: std(0xeadfca, .6), knob: std(0x2c2c2c, .4, .6),
  curtain: lam(0xe7dfcf, { side: THREE.DoubleSide }), rod: std(0x2c2c2c, .5, .5),
  glass: flag(std(0xd6e9f2, .05, 0, { transparent: true, opacity: .28, depthWrite: false, emissive: 0xcfe6f5, emissiveIntensity: .25 }), { noCast: 1, order: 3 }),
  frost: flag(std(0xeef4f6, .6, 0, { transparent: true, opacity: .8, emissive: 0xdfeef5, emissiveIntensity: .3 }), { noCast: 1, order: 3 }),
  shower: flag(std(0xdfeef2, .05, 0, { transparent: true, opacity: .22, depthWrite: false }), { noCast: 1, order: 3 }),
  floorLiving: std(0xffffff, .55), floorBed: std(0xffffff, .6), floorWet: std(0xffffff, .35), floorPuja: std(0xffffff, .5),
  plinth: lam(0xcfc8ba), stone: std(0xcfc9bd, .9), ground: lam(0xb9c4a6),
  ceiling: flag(lam(0xffffff, { emissive: 0xffffff, emissiveIntensity: .3 }), { noCast: 1 }),
  ceilLight: flag(std(0xffffff, .6, 0, { emissive: 0xfff0d0, emissiveIntensity: .8 }), { noCast: 1 }),

// ---------- floor plan data (feet). dir 'x' walls run north-south on the sheet's horizontal axis,
// dir 'z' walls run east-west; lo/hi is the wall thickness range on the other axis.

  { dir: 'z', lo: 33.875, hi: 34.25, from: 21, to: 26.25 },                                                                                               // master entry | master toilet

  { dir: 'x', lo: 31.375, hi: 31.75, from: 12.625, to: 17.125, ops: [door(13.15, 15.65)] },                                                               // passage | common toilet

  [8.21, 37.57, 180, 2.5],                        // bedroom 3 toilet

// [floor type, x0, x1, z0, z1]
const FLOORS = [
  ['Living', 12.625, 29.625, .75, 25.875], ['Living', 12.625, 17.125, 25.875, 31.375], ['Living', .75, 12.25, .75, 11.75], ['Living', 30, 42.25, 12.125, 20.625],

  lampLights.forEach((l, i) => { const p = current.lamps[i]; l.visible = on && !!p; if (p) { l.position.set(p.x, p.y, p.z); l.color.set(L.lamp); l.intensity = 34 * L.lampI * n; } });
}
function applyStyle(key) {
  const s = buildStyle(key);
  if (current) current.group.visible = false;
  current = s; s.group.visible = true;
  for (const [k, v] of Object.entries(s.st.shell)) MAT[k].color.set(v);
  for (const [k, t] of Object.entries(s.floors)) { MAT['floor' + k].map = t; MAT['floor' + k].needsUpdate = true; }
  MAT.floorLiving.roughness = key === 'luxury' ? .16 : .55; MAT.floorWet.roughness = key === 'luxury' ? .2 : .35; MAT.floorPuja.roughness = key === 'luxury' ? .18 : .5;
  MAT.knob.metalness = MAT.rod.metalness = key === 'luxury' ? .95 : .4;
  MAT.pool.color.set(s.st.light.sun);
  applyLook(); renderer.shadowMap.needsUpdate = true;
  document.querySelectorAll('#styles button').forEach(b => b.classList.toggle('on', b.dataset.style === key));
}

// ---------- camera modes: orbit (dollhouse), walk (first person), tour (scripted), fly (transition)
const controls = new OrbitControls(camera, canvas);
controls.target.set(21.5, 1, 21.5); controls.enableDamping = true; controls.dampingFactor = .08;
controls.minDistance = 14; controls.maxDistance = 190; controls.maxPolarAngle = rad(82); controls.autoRotateSpeed = .5;
const DOLL_POS = new THREE.Vector3(21.5, 68, 62), LIVING = { pos: [15.2, 13.4], look: [25.5, 6.6] }, DOOR = { pos: [18.6, 3.4], look: [19.2, 12] };
let mode = 'orbit', yaw = 0, pitch = 0, fly = null, tourT = 0, intro = true;
const keys = new Set(), $ = id => document.getElementById(id);
const HINTS = {
  orbit: 'Drag to rotate · right-drag to pan · scroll to zoom',
  walk: 'Arrow keys or WASD to move · click, then move the mouse to look (or drag) · Shift to go faster · Esc frees the mouse',
  tour: '30-second tour · press Tour again or any view button to stop', fly: '',
};
function setMode(m) {
  mode = m; controls.enabled = m === 'orbit'; if (m !== 'orbit') controls.autoRotate = false;
  if (m !== 'walk' && document.pointerLockElement) document.exitPointerLock();
  $('hint').textContent = HINTS[m]; $('room').classList.toggle('show', m === 'walk' || m === 'tour');
  for (const [id, k] of [['bDoll', 'orbit'], ['bWalk', 'walk'], ['bTour', 'tour']]) $(id).classList.toggle('on', m === k);
}
function setInside(v) {
  if (v === inside) return;
  inside = v; ceilGroup.visible = v; roofMesh.castShadow = v; placeSun();
}
function facing(pos, look) { const dx = look[0] - pos[0], dz = look[1] - pos[1]; return Math.atan2(-dx, -dz); }
function flyTo(pos, quat, fov, near, done, dur = 2.2) {
  setMode('fly');
  fly = { t: 0, dur, p0: camera.position.clone(), q0: camera.quaternion.clone(), f0: camera.fov, p1: pos, q1: quat, f1: fov, near, done };
}
function goDollhouse(dur = 2) {
  intro = false;
  const m = new THREE.Matrix4().lookAt(DOLL_POS, controls.target, camera.up);
  flyTo(DOLL_POS.clone(), new THREE.Quaternion().setFromRotationMatrix(m), 42, 1, () => setMode('orbit'), dur);
}
function goWalk(spot, dur = 2.2) {
  intro = false;
  const y = facing(spot.pos, spot.look), p = -.07;
  flyTo(new THREE.Vector3(spot.pos[0], EYE, spot.pos[1]), new THREE.Quaternion().setFromEuler(new THREE.Euler(p, y, 0, 'YXZ')), 68, .25, () => { yaw = y; pitch = p; setMode('walk'); }, dur);
}

// ---------- collision: the walker is a 1.4 ft wide circle tested against wall and furniture boxes
const RADIUS = .7;
function blocked(x, z) {
  for (const list of [shellCol, current.col]) for (const b of list) {
    const dx = x - Math.max(b.x0, Math.min(x, b.x1)), dz = z - Math.max(b.z0, Math.min(z, b.z1));
    if (dx * dx + dz * dz < RADIUS * RADIUS) return true;
  }
  return false;
}
function walkStep(dt) {
  const f = (keys.has('ArrowUp') || keys.has('KeyW') ? 1 : 0) - (keys.has('ArrowDown') || keys.has('KeyS') ? 1 : 0);
  const s = (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0);
  if (f || s) {
    const sp = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 10 : 5.5) * dt / Math.hypot(f, s);
    let mx = (-Math.sin(yaw) * f + Math.cos(yaw) * s) * sp, mz = (-Math.cos(yaw) * f - Math.sin(yaw) * s) * sp;
    const n = Math.ceil(Math.hypot(mx, mz) / .25); mx /= n; mz /= n;
    for (let i = 0; i < n; i++) {                       // per-axis test lets the walker slide along walls
      if (!blocked(camera.position.x + mx, camera.position.z)) camera.position.x += mx;
      if (!blocked(camera.position.x, camera.position.z + mz)) camera.position.z += mz;
    }
  }
  camera.position.y = EYE; camera.rotation.set(pitch, yaw, 0, 'YXZ');
}
function look(dx, dy) { if (mode !== 'walk') return; yaw -= dx * .0024; pitch = Math.max(-1.2, Math.min(1.2, pitch - dy * .0024)); }
canvas.addEventListener('click', () => { if (mode === 'walk' && !document.pointerLockElement) { try { canvas.requestPointerLock()?.catch?.(() => {}); } catch { /* drag-to-look still works */ } } });
addEventListener('mousemove', e => { if (document.pointerLockElement === canvas) look(e.movementX, e.movementY); else if (e.buttons & 1 && e.target === canvas) look(-e.movementX, -e.movementY); });
addEventListener('keydown', e => { keys.add(e.code); if (e.code.startsWith('Arrow')) e.preventDefault(); if (mode === 'walk' || mode === 'orbit') intro = false; });
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
for (const ev of ['pointerdown', 'wheel']) canvas.addEventListener(ev, () => { intro = false; controls.autoRotate = false; }, { passive: true });

// ---------- 30-second tour: [time s, camera x, z, look-at x, z]. Front door -> living -> drawing ->
// puja -> dining -> kitchen -> master bedroom -> bedroom 2 -> bedroom 3.
const TOUR = [
  [0, 18.6, -4, 18.6, 8], [1, 18.6, 1.8, 19.5, 10], [2.06, 17.2, 4.4, 9, 5], [3.23, 10.6, 4.3, 5.5, 9.5], [3.92, 11.8, 4.4, 8, 9],
  [5.41, 16.8, 7.5, 25, 9], [6.45, 16.2, 13, 22, 12], [7.9, 13.8, 16.35, 7, 13.5], [8.6, 9.4, 16.7, 6.4, 12.6], [9.35, 9.7, 16.9, 6.4, 12.6], [10.25, 15.5, 16.6, 24, 16.4],
  [11.61, 24, 16.4, 34, 16.4], [12.79, 31, 15.8, 36, 16.4], [13.77, 32, 13.4, 33.5, 6], [14.9, 32.2, 9.5, 38.5, 5], [15.94, 32, 13, 37, 17],
  [17.08, 29, 17.6, 30, 22], [18.27, 27.4, 22.3, 31, 23.2], [19.18, 31, 23.15, 35, 30], [20.24, 32.2, 27.4, 38.5, 34.5], [21.75, 30.4, 23.2, 24, 23.5],
  [23.48, 20.5, 23.3, 15, 27], [24.73, 15.9, 24.3, 17.5, 28], [25.6, 15.2, 27.4, 19.5, 28.6], [26.62, 19.3, 28.3, 24.5, 34.5], [27.64, 15.3, 27.6, 13.6, 31],
  [28.61, 14.4, 24.5, 10, 24], [29.25, 12.9, 23.2, 6, 28], [30, 9.9, 23.1, 5.5, 30.5],
];
const TOUR_LEN = 30, _q2 = new THREE.Quaternion(), _look = new THREE.Vector3(), _mm = new THREE.Matrix4();
// Catmull-Rom with the keyframe times as knots (Barry-Goldman): smooth in position and speed
function tourAt(T, o, out) {
  let i = 0; while (i < TOUR.length - 2 && TOUR[i + 1][0] <= T) i++;
  const K = j => { if (j < 0) { const a = TOUR[0], b = TOUR[1]; return [2 * a[0] - b[0], 2 * a[1] - b[1], 2 * a[2] - b[2], 2 * a[3] - b[3], 2 * a[4] - b[4]]; } if (j >= TOUR.length) { const a = TOUR.at(-1), b = TOUR.at(-2); return a.map((v, k) => 2 * v - b[k]); } return TOUR[j]; };
  const p = [K(i - 1), K(i), K(i + 1), K(i + 2)], t = p.map(k => k[0]);
  for (let c = 0; c < 2; c++) {
    const v = p.map(k => k[o + c]), L = (a, b, ta, tb) => a + (b - a) * (T - ta) / (tb - ta);
    const a1 = L(v[0], v[1], t[0], t[1]), a2 = L(v[1], v[2], t[1], t[2]), a3 = L(v[2], v[3], t[2], t[3]);
    out[c] = L(L(a1, a2, t[0], t[2]), L(a2, a3, t[1], t[3]), t[1], t[2]);
  }
  return out;
}
const _tp = [0, 0], _tl = [0, 0];
function tourStep(dt, snap = false) {
  tourT = Math.min(TOUR_LEN, tourT + dt);
  tourAt(tourT, 1, _tp); tourAt(tourT, 3, _tl);
  camera.position.set(_tp[0], EYE, _tp[1]);
  _q2.setFromRotationMatrix(_mm.lookAt(camera.position, _look.set(_tl[0], 4.4, _tl[1]), camera.up));
  snap ? camera.quaternion.copy(_q2) : camera.quaternion.slerp(_q2, 1 - Math.exp(-dt * 5));
  if (tourT >= TOUR_LEN) { const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ'); yaw = e.y; pitch = e.x; setMode('walk'); }
}
function startTour() {
  intro = false; fly = null;
  crossFade(() => { setMode('tour'); setInside(true); camera.fov = 68; camera.near = .25; camera.updateProjectionMatrix(); tourT = 0; tourStep(0, true); });
}
function roomAt(x, z) {
  if (mode === 'tour' && z < 1.4) return 'Front Door';
  for (const [name, x0, x1, z0, z1] of ROOMS) if (x >= x0 - .4 && x <= x1 + .4 && z >= z0 - .4 && z <= z1 + .4) return name;
  return '';
}

// ---------- cross-fade: the last frame is copied to an overlay canvas which then fades out over the new look
const fadeC = $('fade'), fadeG = fadeC.getContext('2d');
function crossFade(change, ms = 900) {
  renderer.render(scene, camera);
  fadeC.width = canvas.width; fadeC.height = canvas.height; fadeG.drawImage(canvas, 0, 0);
  fadeC.style.transition = 'none'; fadeC.style.opacity = 1;
  change();
  renderer.render(scene, camera);
  requestAnimationFrame(() => requestAnimationFrame(() => { fadeC.style.transition = `opacity ${ms}ms ease-in-out`; fadeC.style.opacity = 0; }));
}
let bannerTimer = 0;
function chooseStyle(key) {
  if (current && current.key === key) return;
  crossFade(() => applyStyle(key), 1000);
  $('banner').textContent = STYLES[key].name; $('banner').classList.add('show');
  clearTimeout(bannerTimer); bannerTimer = setTimeout(() => $('banner').classList.remove('show'), 2000);
}
document.querySelectorAll('#styles button').forEach(b => b.onclick = () => chooseStyle(b.dataset.style));
document.querySelectorAll('#times button').forEach(b => b.onclick = () => { nightTarget = b.dataset.time === 'evening' ? 1 : 0; document.querySelectorAll('#times button').forEach(o => o.classList.toggle('on', o === b)); });
$('bDoll').onclick = () => goDollhouse();
$('bLiving').onclick = () => goWalk(LIVING);
$('bWalk').onclick = () => goWalk(DOOR);
$('bTour').onclick = () => mode === 'tour' ? (() => { const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ'); yaw = e.y; pitch = e.x; setMode('walk'); })() : startTour();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------- start
buildShell();
applyStyle('scandi');
camera.position.copy(DOLL_POS); controls.update(); controls.autoRotate = true; placeSun(); setMode('orbit');
const idle = window.requestIdleCallback || (f => setTimeout(f, 600));
idle(() => { buildStyle('luxury'); idle(() => buildStyle('family')); });   // pre-build the other styles so switching is instant

const clock = new THREE.Clock();
let introT = 0, fpsT = 0, fpsN = 0, slow = 0;
function frame() {
  requestAnimationFrame(frame);
  const raw = clock.getDelta(), dt = Math.min(raw, .05);
  if (intro && mode === 'orbit' && (introT += dt) > 5) goWalk(LIVING, 3);   // above first, then inside the living room
  if (night !== nightTarget) { night += Math.sign(nightTarget - night) * Math.min(Math.abs(nightTarget - night), dt / 1.2); applyLook(); }
  if (mode === 'orbit') controls.update();
  else if (mode === 'walk') walkStep(dt);
  else if (mode === 'tour') tourStep(dt);
  else if (fly) {
    fly.t = Math.min(1, fly.t + dt / fly.dur);
    const k = fly.t * fly.t * (3 - 2 * fly.t);
    camera.position.lerpVectors(fly.p0, fly.p1, k); camera.quaternion.slerpQuaternions(fly.q0, fly.q1, k);
    camera.fov = fly.f0 + (fly.f1 - fly.f0) * k; camera.near = fly.near; camera.updateProjectionMatrix();
    if (fly.t >= 1) { const d = fly.done; fly = null; d(); }
  }
  setInside(camera.position.y < H + .5 && mode !== 'orbit');
  if (mode === 'walk' || mode === 'tour') $('room').textContent = roomAt(camera.position.x, camera.position.z);
  renderer.render(scene, camera);
  // frame-rate guard: if the laptop cannot hold ~60 FPS, lower the render resolution a step at a time
  fpsN++; fpsT += raw;
  if (fpsT >= 1) {
    const fps = fpsN / fpsT; $('fps').textContent = Math.round(fps) + ' FPS'; fpsN = fpsT = 0;
    slow = fps < 50 && raw < .25 ? slow + 1 : 0;
    if (slow >= 2 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - .25); renderer.setPixelRatio(pixelRatio); slow = 0; }
  }
}
frame();
</script>
